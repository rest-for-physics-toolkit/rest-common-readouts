# Readout files (generate.sh, overlaps checked), generated at each push and pull request (kept as a workflow
# artifact, to check them) and attached to the release of each tag v* (e.g. git tag v1.0 && git push origin
# v1.0). The projects read them with
#   https://github.com/<owner>/rest-common-readouts/releases/download/<tag>/<asset>
#
# Run in the image with restv2 installed (published by rest-framework): ghcr.io/<owner>/rest:latest, or the
# image of the repository variable REST_IMAGE (Settings, Secrets and variables, Actions, Variables), e.g. a
# release of restv2 (ghcr.io/<owner>/rest:v1.0).
name: Readouts

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

jobs:
  readouts:
    name: Readouts
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.REST_IMAGE || format('ghcr.io/{0}/rest:latest', github.repository_owner) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate the readouts
        run: ./generate.sh

      - uses: actions/upload-artifact@v4
        with:
          name: readouts
          path: output/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
